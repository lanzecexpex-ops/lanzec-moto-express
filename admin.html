<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07111f">

    <title>Administración | LANZEC MOTO EXPRESS</title>

    <style>
        :root {
            color-scheme: dark;
            --bg: #07111f;
            --panel: #101f32;
            --panel2: #142942;
            --text: #f3f7ff;
            --muted: #a9bad0;
            --cyan: #24d7ef;
            --blue: #2878ff;
            --red: #ff6577;
            --line: #29415c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: radial-gradient(ellipse at top, #102a48 0, #07111f 55%);
            color: var(--text);
            font: 16px/1.5 system-ui, -apple-system, Segoe UI, Arial, sans-serif;
            min-height: 100vh;
        }

        a {
            color: var(--cyan);
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px clamp(16px, 4vw, 56px);
            border-bottom: 1px solid var(--line);
            background: #07111fdc;
            position: sticky;
            top: 0;
            backdrop-filter: blur(12px);
            z-index: 5;
        }

        .brand {
            font-weight: 900;
            letter-spacing: .5px;
            text-decoration: none;
            color: white;
        }

        .brand span {
            color: var(--cyan);
        }

        nav {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .shell {
            width: min(1120px, 94%);
            margin: 36px auto 70px;
        }

        .hero {
            padding: clamp(24px, 6vw, 72px) 0;
            display: grid;
            grid-template-columns: 1.2fr .8fr;
            gap: 32px;
            align-items: center;
        }

        .hero h1 {
            font-size: clamp(2.4rem, 6vw, 4.8rem);
            line-height: 1.02;
            margin: 0 0 18px;
        }

        .hero h1 em {
            font-style: normal;
            color: var(--cyan);
        }

        .lead {
            font-size: 1.15rem;
            color: var(--muted);
            max-width: 650px;
        }

        .card {
            background: linear-gradient(145deg, #12253b, #0c1929);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: clamp(18px, 3vw, 30px);
            box-shadow: 0 18px 50px #0003;
            margin: 18px 0;
        }

        .card h1,
        .card h2 {
            margin-top: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .grid.three {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .btn {
            border: 0;
            border-radius: 11px;
            background: linear-gradient(90deg, var(--blue), #16bde3);
            color: #fff;
            font-weight: 800;
            text-decoration: none;
            padding: 12px 17px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            gap: 7px;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .btn:disabled {
            opacity: .5;
            cursor: wait;
        }

        .btn.ghost {
            background: transparent;
            border: 1px solid #45627f;
            color: var(--text);
        }

        .btn.secondary {
            background: #156b82;
        }

        .btn.danger {
            background: #9d2d42;
        }

        .btn.small {
            padding: 8px 11px;
            font-size: .88rem;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        form {
            display: grid;
            gap: 14px;
        }

        label {
            display: grid;
            gap: 6px;
            color: var(--muted);
            font-weight: 650;
        }

        input,
        select,
        textarea {
            width: 100%;
            background: #081626;
            color: var(--text);
            border: 1px solid #36506c;
            border-radius: 10px;
            padding: 12px;
            font: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #1cb9e0;
            border-color: transparent;
        }

        input[type=radio],
        input[type=checkbox] {
            width: auto;
            accent-color: var(--cyan);
        }

        .checkrow {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .checkrow label {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .muted,
        small {
            color: var(--muted);
        }

        .notice {
            margin: 16px auto;
            padding: 13px 16px;
            border-radius: 10px;
            width: min(1120px, 94%);
            background: #133d4b;
            border: 1px solid #1e9bb5;
        }

        .notice.bad {
            background: #4a1d2b;
            border-color: #a83c55;
        }

        .notice[hidden] {
            display: none;
        }

        .pill {
            display: inline-block;
            padding: 4px 9px;
            border: 1px solid #3d6480;
            border-radius: 99px;
            color: var(--cyan);
            font-size: .8rem;
            text-transform: capitalize;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
        }

        .service-card,
        .admin-row {
            border: 1px solid var(--line);
            background: #0b1a2b;
            border-radius: 14px;
            padding: 16px;
            margin: 12px 0;
        }

        .service-card p {
            margin: 8px 0;
        }

        .empty {
            border: 1px dashed #36506c;
            border-radius: 12px;
            padding: 22px;
            color: var(--muted);
            text-align: center;
        }

        .stat {
            padding: 17px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #0c1c2e;
        }

        .stat b {
            display: block;
            font-size: 1.8rem;
            color: var(--cyan);
        }

        .stat span {
            color: var(--muted);
            font-size: .9rem;
        }

        .admin-row {
            display: grid;
            gap: 10px;
        }

        .admin-row small {
            display: block;
            margin-top: 4px;
        }

        .details {
            border-top: 1px solid var(--line);
            padding-top: 10px;
        }

        .plan {
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--line);
            padding: 15px;
            border-radius: 12px;
            cursor: pointer;
        }

        .plan span {
            display: grid;
            flex: 1;
        }

        .plan strong {
            font-size: 1.4rem;
            color: var(--cyan);
        }

        .avatar {
            max-width: 100px;
            border-radius: 50%;
            border: 2px solid var(--cyan);
        }

        .footer {
            text-align: center;
            padding: 30px;
            color: var(--muted);
            border-top: 1px solid var(--line);
        }

        .badge {
            display: inline-block;
            color: #06131d;
            background: var(--cyan);
            border-radius: 99px;
            padding: 5px 11px;
            font-weight: 900;
            font-size: .8rem;
        }

        .split {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .section-title {
            margin-top: 35px;
        }

        .note {
            border-left: 3px solid var(--cyan);
            padding: 8px 13px;
            color: var(--muted);
        }

        @media(max-width:760px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .grid,
            .grid.three {
                grid-template-columns: 1fr;
            }

            .topbar {
                align-items: flex-start;
                flex-direction: column;
            }

            .shell {
                margin-top: 20px;
            }

            .actions .btn {
                flex: 1;
            }
        }
    
        .admin-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 6px }
        .admin-tools input, .admin-tools select { width: auto; flex: 1 1 220px }
        .admin-jump { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 0 }
        .admin-jump a { text-decoration: none }
        .section-title { scroll-margin-top: 90px }
    
        /* ===== Panel admin compacto (móvil) ===== */
        [hidden] { display: none !important }
        body { padding-bottom: 76px }
        .shell { margin: 14px auto 20px }
        .section-title { margin: 14px 0 8px; font-size: 1.1rem }
        .stats2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 14px 0 }
        .stats2 .stat { text-align: left; font: inherit; color: inherit; cursor: pointer; padding: 12px }
        .stats2 .stat b { font-size: 1.5rem }
        section > input[type=search], section > select { margin: 12px 0 8px }
        .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px }
        .chip { flex: 0 0 auto; border: 1px solid #45627f; background: transparent; color: var(--text); border-radius: 99px; padding: 8px 14px; font: inherit; font-size: .9rem; cursor: pointer }
        .chip.on { background: var(--blue); border-color: var(--blue); font-weight: 700 }
        .arow { border: 1px solid var(--line); background: #0b1a2b; border-radius: 12px; margin: 8px 0 }
        .arow.pad { padding: 12px }
        .arow summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px; min-height: 52px; cursor: pointer }
        .arow summary::-webkit-details-marker { display: none }
        .arow .top { display: flex; justify-content: space-between; align-items: center; gap: 10px }
        .arow p { margin: 8px 0 }
        .who { display: grid; min-width: 0 }
        .who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
        .who small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted) }
        .abody { padding: 4px 12px 12px; border-top: 1px solid var(--line) }
        .abody small, .arow.pad > small { display: block; margin-top: 5px }
        .actions.big .btn { flex: 1 1 120px; min-height: 46px }
        .pill.st-pending { color: #ffc857; border-color: #8a6a1f }
        .pill.st-active { color: #5be3a0; border-color: #1f7a52 }
        .pill.st-suspended, .pill.st-rejected { color: var(--red); border-color: #8a2d3c }
        .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; display: flex; background: #07111ff2; border-top: 1px solid var(--line); backdrop-filter: blur(12px); padding-bottom: env(safe-area-inset-bottom) }
        .tabbar button { position: relative; flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 11px; padding: 8px 2px; min-height: 56px; display: grid; justify-items: center; gap: 2px; cursor: pointer }
        .tabbar button i { font-style: normal; font-size: 20px; line-height: 1 }
        .tabbar button.on { color: var(--cyan); font-weight: 700 }
        .tabbar .dot { position: absolute; top: 4px; left: 54%; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: #e0364f; color: #fff; font-size: 11px; line-height: 18px; text-align: center }
        @media (min-width: 761px) { .stats2 { grid-template-columns: repeat(3, minmax(0, 1fr)) } }
    </style>
</head>

<body data-page="admin">

    <header class="topbar">

        <a class="brand" href="index.html">
            LANZEC <span>MOTO EXPRESS</span>
        </a>

        <nav>
            <a class="btn ghost small" href="index.html">Inicio</a>
            <a class="btn ghost small" href="suscripcion.html">Suscripciones</a>
            <a class="btn ghost small" href="reclamos.html">Reclamos</a>
            <button class="btn danger small" data-logout>
                Cerrar sesión
            </button>
        </nav>

    </header>

    <div id="notice" class="notice" hidden></div>

    <main class="shell">

        <div class="split">
            <h1 id="welcome" style="margin:0;font-size:1.4rem">Panel de administración</h1>
            <div style="display:flex;gap:8px;align-items:center">
                <small id="adminUpdated" class="muted"></small>
                <button id="adminRefresh" class="btn secondary small" type="button">⟳ Actualizar</button>
            </div>
        </div>

        <section data-tab="home">
            <div id="stats" class="stats2"></div>
            <div id="todo"></div>
        </section>

        <section data-tab="users" hidden>
            <input id="adminSearch" type="search" placeholder="Buscar nombre, correo, celular, DNI o placa">
            <div class="chips">
                <button type="button" class="chip on" data-chip="all">Todos</button>
                <button type="button" class="chip" data-chip="client">Clientes</button>
                <button type="button" class="chip" data-chip="transporter">Transportistas</button>
                <button type="button" class="chip" data-chip="pending">Pendientes</button>
            </div>
            <div id="adminUsers"></div>
        </section>

        <section data-tab="pay" hidden>
            <h2 class="section-title">Pagos y suscripciones</h2>
            <div id="adminSubscriptions"></div>
            <p class="note">La aprobación de transportista y la activación de suscripción son procesos independientes.</p>
        </section>

        <section data-tab="svc" hidden>
            <h2 class="section-title">Servicios</h2>
            <select id="svFilter">
                <option value="">Todos los estados</option>
                <option value="requested">Solicitados</option>
                <option value="accepted">Aceptados</option>
                <option value="in_progress">En curso</option>
                <option value="completed">Finalizados</option>
                <option value="cancelled">Cancelados</option>
            </select>
            <div id="adminServices"></div>
        </section>

        <section data-tab="comp" hidden>
            <h2 class="section-title">Reclamos</h2>
            <div id="adminComplaints"></div>
        </section>

        <section data-tab="log" hidden>
            <h2 class="section-title">Registro de auditoría</h2>
            <div id="adminAudit"></div>
        </section>

    </main>

    <nav class="tabbar">
        <button type="button" class="on" data-go="home"><i>🏠</i><span>Inicio</span></button>
        <button type="button" data-go="users"><i>👥</i><span>Usuarios</span><b class="dot" id="b-users" hidden></b></button>
        <button type="button" data-go="pay"><i>💳</i><span>Pagos</span><b class="dot" id="b-pay" hidden></b></button>
        <button type="button" data-go="svc"><i>🏍️</i><span>Servicios</span></button>
        <button type="button" data-go="comp"><i>📣</i><span>Reclamos</span><b class="dot" id="b-comp" hidden></b></button>
        <button type="button" data-go="log"><i>📋</i><span>Historial</span></button>
    </nav>

    <footer class="footer">
        © 2026 LANZEC MOTO EXPRESS · Juliaca, Perú
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
    <script src="js/config.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
